<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Змейка</title>
<style>
  :root {
    --green: #5cffb0;
    --bg: #070b12;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(900px 600px at 20% -10%, rgba(66, 255, 176, 0.10), transparent 60%),
      radial-gradient(800px 600px at 110% 110%, rgba(255, 77, 109, 0.10), transparent 60%),
      var(--bg);
    color: #e7f5ee;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap { width: min(560px, 100%, calc(100dvh - 190px)); min-width: 260px; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0;
    font-size: clamp(18px, 4vw, 26px);
    letter-spacing: 0.32em;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 22px rgba(92, 255, 176, 0.55);
  }
  .stat {
    display: flex;
    flex-direction: column;
    min-width: 74px;
    padding: 7px 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
  }
  .stat:last-of-type { text-align: right; align-items: flex-end; }
  .stat span {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #79a595;
  }
  .stat b {
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }
  .stage {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(92, 255, 176, 0.18);
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.6),
      0 24px 60px -20px rgba(0, 0, 0, 0.9),
      inset 0 0 60px rgba(0, 0, 0, 0.5);
    background: #0a0f18;
  }
  canvas { display: block; width: 100%; aspect-ratio: 1 / 1; }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(5, 9, 14, 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .overlay.on { display: flex; }
  .card {
    text-align: center;
    max-width: 320px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: clamp(22px, 5vw, 30px);
    color: #fff;
    letter-spacing: 0.04em;
  }
  .card p {
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.65;
    color: #9dbbb0;
  }
  .card p b { color: var(--green); }
  button {
    font: inherit;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 14px;
    padding: 12px 34px;
    border-radius: 999px;
    border: 0;
    cursor: pointer;
    color: #04120c;
    background: linear-gradient(180deg, #7dffc0, #33d894);
    box-shadow: 0 10px 26px -10px rgba(70, 255, 175, 0.9);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  footer {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
    color: #5f7d72;
  }
  kbd {
    font-family: inherit;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #b9d6ca;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stat"><span>Счёт</span><b id="score">0</b></div>
    <h1>ЗМЕЙКА</h1>
    <div class="stat"><span>Рекорд</span><b id="best">0</b></div>
  </header>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="ovTitle">Готов?</h2>
        <p id="ovText"></p>
        <button id="ovBtn">Играть</button>
      </div>
    </div>
  </div>

  <footer>
    <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> или <kbd>WASD</kbd> — движение ·
    <kbd>Space</kbd> — пауза · <kbd>R</kbd> — заново
  </footer>
</div>

<script>
(() => {
  "use strict";

  const COLS = 24;
  const ROWS = 24;
  const START_MS = 135;
  const MIN_MS = 62;

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const ovBtn = document.getElementById("ovBtn");

  let cellPx = 20;
  let state = "ready";          // ready | playing | paused | over
  let snake = [];
  let dir = { x: 1, y: 0 };
  let queue = [];
  let food = null;
  let score = 0;
  let best = Number(localStorage.getItem("snake.best") || 0);
  let stepMs = START_MS;
  let acc = 0;
  let last = 0;

  bestEl.textContent = best;

  /* ---------- звук ---------- */
  let ac = null;
  function tone(freq, dur, type, vol, slideTo) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const t0 = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(vol || 0.05, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* звук необязателен */ }
  }
  const sfxEat = () => { tone(760, 0.07, "square", 0.045); tone(1180, 0.09, "triangle", 0.035, 1500); };
  const sfxDie = () => { tone(320, 0.18, "sawtooth", 0.05, 90); tone(180, 0.35, "square", 0.035, 60); };
  const sfxTurn = () => tone(420, 0.03, "sine", 0.02);

  /* ---------- размеры ---------- */
  function fit() {
    const cssW = canvas.clientWidth || 400;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const px = Math.max(120, Math.round(cssW * dpr));
    if (canvas.width !== px) {
      canvas.width = px;
      canvas.height = px;
    }
    cellPx = canvas.width / COLS;
    draw();
  }

  /* ---------- игра ---------- */
  function reset() {
    snake = [{ x: 11, y: 12 }, { x: 10, y: 12 }, { x: 9, y: 12 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    stepMs = START_MS;
    acc = 0;
    last = 0;
    scoreEl.textContent = "0";
    spawnFood();
  }

  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function pushDir(x, y) {
    const prev = queue.length ? queue[queue.length - 1] : dir;
    if (prev.x === -x && prev.y === -y) return;
    if (prev.x === x && prev.y === y) return;
    if (queue.length < 2) {
      queue.push({ x, y });
      sfxTurn();
    }
  }

  function step() {
    if (queue.length) dir = queue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();

    const willGrow = !!food && head.x === food.x && head.y === food.y;
    // хвост уходит с клетки, если не растём — в него врезаться можно
    const body = willGrow ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return die();

    snake.unshift(head);

    if (willGrow) {
      score += 1;
      scoreEl.textContent = score;
      stepMs = Math.max(MIN_MS, START_MS - score * 3);
      spawnFood();
      sfxEat();
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("snake.best", String(best));
      }
    } else {
      snake.pop();
    }
  }

  function die() {
    state = "over";
    sfxDie();
    showOverlay(
      "Игра окончена",
      `Счёт: <b>${score}</b><br>Рекорд: <b>${best}</b>`,
      "Заново"
    );
  }

  function start() {
    reset();
    state = "playing";
    hideOverlay();
    tone(520, 0.06, "sine", 0.03, 720);
  }

  function togglePause() {
    if (state === "playing") {
      state = "paused";
      showOverlay("Пауза", "Нажмите <b>пробел</b>, чтобы продолжить.", "Продолжить");
    } else if (state === "paused") {
      state = "playing";
      last = 0;
      acc = 0;
      hideOverlay();
    }
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    ovBtn.textContent = btn;
    overlay.classList.add("on");
  }
  function hideOverlay() {
    overlay.classList.remove("on");
  }

  function onPrimary() {
    if (state === "playing" || state === "paused") togglePause();
    else start();
  }

  ovBtn.addEventListener("click", () => {
    if (state === "paused") togglePause();
    else start();
  });

  /* ---------- ввод ---------- */
  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0],
  };

  window.addEventListener("keydown", (e) => {
    if (KEYS[e.code]) {
      e.preventDefault();
      if (state === "ready" || state === "over") start();
      if (state === "playing") pushDir(KEYS[e.code][0], KEYS[e.code][1]);
      return;
    }
    if (e.code === "Space" || e.code === "KeyP") {
      e.preventDefault();
      if (state === "ready" || state === "over") start();
      else togglePause();
      return;
    }
    if (e.code === "KeyR") {
      e.preventDefault();
      start();
    }
  }, { passive: false });

  // свайпы — на случай тач-экрана
  let touch = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touch = { x: t.clientX, y: t.clientY };
    if (state === "ready" || state === "over") start();
  }, { passive: true });

  canvas.addEventListener("touchend", (e) => {
    if (!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x;
    const dy = t.clientY - touch.y;
    if (Math.hypot(dx, dy) > 24 && state === "playing") {
      if (Math.abs(dx) > Math.abs(dy)) pushDir(dx > 0 ? 1 : -1, 0);
      else pushDir(0, dy > 0 ? 1 : -1);
    }
    touch = null;
  }, { passive: true });

  window.addEventListener("blur", () => {
    if (state === "playing") togglePause();
  });

  /* ---------- отрисовка ---------- */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  }

  function mix(a, b, t) {
    const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function draw() {
    const W = canvas.width;
    const H = canvas.height;
    const c = cellPx;

    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#0e1622");
    bg.addColorStop(1, "#080d15");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(120, 255, 195, 0.045)";
    ctx.lineWidth = Math.max(1, c * 0.03);
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * c, 0); ctx.lineTo(i * c, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * c); ctx.lineTo(W, i * c); ctx.stroke();
    }

    // еда
    if (food) {
      const t = performance.now() / 380;
      const pulse = 0.5 + 0.5 * Math.sin(t);
      const cx = (food.x + 0.5) * c;
      const cy = (food.y + 0.5) * c;
      const r = c * (0.26 + 0.05 * pulse);
      ctx.save();
      ctx.shadowColor = "rgba(255, 77, 109, 0.95)";
      ctx.shadowBlur = c * (0.7 + 0.4 * pulse);
      ctx.fillStyle = "#ff5c78";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
      ctx.beginPath();
      ctx.arc(cx - r * 0.32, cy - r * 0.34, r * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // змейка
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const k = n === 1 ? 0 : i / (n - 1);
      const pad = c * 0.075;
      const x = s.x * c + pad;
      const y = s.y * c + pad;
      const size = c - pad * 2;
      const rad = c * (0.3 - 0.1 * k);

      if (i === 0) {
        ctx.save();
        ctx.shadowColor = "rgba(95, 255, 180, 0.8)";
        ctx.shadowBlur = c * 0.7;
      }
      ctx.fillStyle = mix("#a9ffd4", "#17845c", Math.pow(k, 0.75));
      roundRect(x, y, size, size, rad);
      ctx.fill();
      if (i === 0) ctx.restore();
    }

    // глаза
    if (n) {
      const head = snake[0];
      const hx = (head.x + 0.5) * c;
      const hy = (head.y + 0.5) * c;
      const fwd = c * 0.17;
      const side = c * 0.19;
      const px = -dir.y;
      const py = dir.x;
      ctx.fillStyle = "#06160f";
      for (const sgn of [1, -1]) {
        const ex = hx + dir.x * fwd + px * side * sgn;
        const ey = hy + dir.y * fwd + py * side * sgn;
        ctx.beginPath();
        ctx.arc(ex, ey, c * 0.1, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* ---------- цикл ---------- */
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    const dt = Math.min(t - last, 120);
    last = t;

    if (state === "playing") {
      acc += dt;
      let guard = 0;
      while (acc >= stepMs && state === "playing" && guard++ < 4) {
        acc -= stepMs;
        step();
      }
    }
    draw();
  }

  /* ---------- старт ---------- */
  reset();
  showOverlay(
    "Готов?",
    "Стрелки или <b>WASD</b> — движение.<br>Собирай еду, не врезайся в стены и себя.",
    "Играть"
  );

  if (window.ResizeObserver) {
    new ResizeObserver(fit).observe(canvas);
  }
  window.addEventListener("resize", fit);

  fit();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
