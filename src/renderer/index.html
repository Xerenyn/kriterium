<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Критериум</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar">
    <div class="tb-brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7l9-4.5Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5 16.5 10v4L12 16.5 7.5 14v-4L12 7.5Z" fill="currentColor"/></svg>
      </span>
      <span class="tb-name">Критериум</span>
      <span class="tb-sep"></span>
      <span class="tb-sub">оценка игр по критериям</span>
    </div>
    <div class="tb-drag"></div>
    <div class="tb-controls">
      <button class="tb-btn" data-win="minimize" title="Свернуть" aria-label="Свернуть">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="tb-btn" data-win="maximize" title="Развернуть" aria-label="Развернуть">
        <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="tb-btn danger" data-win="close" title="Закрыть" aria-label="Закрыть">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="m3 3 6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34"><path d="M20 3.5 35 11v18L20 36.5 5 29V11L20 3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/><path d="M20 11 29 15.5v9L20 29l-9-4.5v-9L20 11Z" fill="currentColor" opacity=".9"/></svg>
        </div>
        <div>
          <div class="brand-title">Критериум</div>
          <div class="brand-sub">оценка игр</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-route="#/overview">
          <svg viewBox="0 0 20 20" width="17" height="17"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Обзор</span>
        </button>
        <button class="nav-item" data-route="#/new">
          <svg viewBox="0 0 20 20" width="17" height="17"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Новая оценка</span>
        </button>
        <button class="nav-item" data-route="#/library">
          <svg viewBox="0 0 20 20" width="17" height="17"><path d="M4 3h4v14H4zM9.5 4.5l3.6-1 3.4 12.7-3.6 1z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>Мои оценки</span>
          <em class="nav-count" id="nav-count"></em>
        </button>
        <div class="nav-label">система</div>
        <button class="nav-item" data-route="#/patches">
          <svg viewBox="0 0 20 20" width="17" height="17"><path d="M10 2.5v4M10 13.5v4M2.5 10h4M13.5 10h4M4.7 4.7l2.8 2.8M12.5 12.5l2.8 2.8M15.3 4.7l-2.8 2.8M7.5 12.5l-2.8 2.8" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Патчи</span>
        </button>
        <button class="nav-item" data-route="#/profile">
          <svg viewBox="0 0 20 20" width="17" height="17"><circle cx="10" cy="6.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 17c.8-3.3 3.4-5 6.5-5s5.7 1.7 6.5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Мой профиль</span>
        </button>
        <button class="nav-item" data-route="#/settings">
          <svg viewBox="0 0 20 20" width="17" height="17"><circle cx="10" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.6 4.6l1.5 1.5M13.9 13.9l1.5 1.5M15.4 4.6l-1.5 1.5M6.1 13.9l-1.5 1.5" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Настройки</span>
        </button>
      </nav>

      <div class="side-bottom">
        <button class="profile-mini" data-route="#/profile" id="profile-mini"></button>
        <div class="side-version" id="side-version">Критериум</div>
      </div>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <div class="boot" id="boot">
    <div class="boot-mark">
      <svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3.5 35 11v18L20 36.5 5 29V11L20 3.5Z" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><path d="M20 11 29 15.5v9L20 29l-9-4.5v-9L20 11Z" fill="currentColor"/></svg>
    </div>
    <div class="boot-text">Загрузка…</div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
